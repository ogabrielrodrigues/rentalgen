{{define "root"}}<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Recibos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    {{range .Rentals}}
      {{if not .Skip}}
        <div class="rental">
          {{if .OnlyVoucher}}
            {{template "voucher" .}} {{template "voucher" .}}
          {{else}}
            {{template "voucher" .}} {{template "bordereau" .}}
            {{template "bordereau" .}} {{template "voucher" .}}
          {{end}}
        </div>
      {{end}}
    {{end}}
  </body>
</html>
{{end}}
