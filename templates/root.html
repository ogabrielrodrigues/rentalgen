{{define "root"}}
<html>
  <head>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Aptos Narrow", "Aptos", "Segoe UI", sans-serif;
      }
    </style>
  </head>

  <body class="w-screen overflow-x-hidden">
    {{range .Rentals}}
      {{if eq .Skip nil}}
        <div class="min-h-screen w-screen max-h-[400vh]">
          {{if eq .OnlyVoucher nil}}
            {{template "voucher" .}} {{template "bordereau" .}}
            {{template "bordereau" .}} {{template "voucher" .}}
          {{else}}
            {{template "voucher" .}} {{template "voucher" .}}
          {{end}}
        </div>
      {{end}}
    {{end}}
  </body>
</html>
{{end}}
